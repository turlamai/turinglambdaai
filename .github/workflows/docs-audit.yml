name: Product documentation source links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "docs/product-sites.json"
      - "scripts/audit_product_docs.py"
      - "tests/test_docs_audit.py"
      - ".github/workflows/docs-audit.yml"
  push:
    paths:
      - "docs/product-sites.json"
      - "scripts/audit_product_docs.py"
      - "tests/test_docs_audit.py"
      - ".github/workflows/docs-audit.yml"

permissions:
  contents: read

concurrency:
  group: product-documentation-audit
  cancel-in-progress: true

jobs:
  source-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no network)
        run: python3 -m unittest discover -s tests -p 'test_docs_audit.py' -v
      - name: Audit current primary site sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_product_docs.py
