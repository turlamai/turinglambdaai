name: Product release download links

on:
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 1"
  pull_request:
    paths:
      - "scripts/audit_product_downloads.py"
      - "tests/test_download_audit.py"
      - ".github/workflows/docs-downloads-audit.yml"
  push:
    paths:
      - "scripts/audit_product_downloads.py"
      - "tests/test_download_audit.py"
      - ".github/workflows/docs-downloads-audit.yml"

permissions:
  contents: read

# Every main/scheduled run is distinct; only superseded PR revisions cancel.
# GitHub also replaces pending runs with the same concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests
        run: python3 -m unittest discover -s tests -p 'test_download_audit.py' -v
      - name: Verify published download asset names
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.audit_product_downloads
